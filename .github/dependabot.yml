version: 2
updates:
  # npm dependencies -- group dev tooling into one PR to cut noise.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint declares `peer typescript >=4.8.4 <6.1.0`, so TypeScript 7 cannot be
      # installed alongside it -- `npm ci` fails to resolve. Minor and patch updates still come
      # through. Drop this entry once typescript-eslint widens its peer range.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # GitHub Actions used in workflows (keeps checkout/setup-node current).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
